# Nexus Communication Protocol Configuration
# QUIC + TLS 1.3 for enhanced security and reduced latency

# Rate limiting zones (must be defined before use)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# TLS 1.3 Configuration
ssl_protocols TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256';

# SSL/TLS Session Configuration
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
ssl_session_tickets off;

# OCSP Stapling
ssl_stapling on;
ssl_stapling_verify on;
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

# Security Headers
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;

# QUIC Configuration
quic_retry on;
ssl_early_data off;

# HTTP/3 Support
listen 443 quic reuseport;
listen 443 ssl http2;

# Add Alt-Svc header to advertise HTTP/3
add_header Alt-Svc 'h3=":443"; ma=86400, h3-29=":443"; ma=86400' always;

# Disable non-encrypted protocols
# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# Main HTTPS/QUIC server block
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    
    server_name nexus.local;
    
    # SSL Certificate Configuration
    ssl_certificate /etc/nexus/ssl/cert.pem;
    ssl_certificate_key /etc/nexus/ssl/key.pem;
    
    # Trusted CA certificates for client certificate verification
    ssl_client_certificate /etc/nexus/ssl/ca.pem;
    ssl_verify_client optional;
    
    # Root directory
    root /var/www/nexus;
    index index.html;
    
    # Security: Disable directory listing
    autoindex off;
    
    # Logging
    access_log /var/log/nginx/nexus-access.log;
    error_log /var/log/nginx/nexus-error.log;
    
    location / {
        try_files $uri $uri/ =404;
    }
    
    # API endpoints with additional security
    location /api/ {
        # Rate limiting
        limit_req zone=api_limit burst=10 nodelay;
        
        # CORS headers (adjust as needed)
        add_header Access-Control-Allow-Origin "https://nexus.local" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
