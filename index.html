<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus | Picasso Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --p-blue: #0055a4; --p-yellow: #f4d03f; --p-red: #eb4d4b; --p-white: #f5f5f5; --p-black: #2c3e50; }
        
        body { margin: 0; background: var(--p-white); color: var(--p-black); font-family: 'Helvetica', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Picasso-Hintergrund Elemente */
        .cubism-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.15; }
        
        header { padding: 20px; border-bottom: 4px solid var(--p-black); background: var(--p-yellow); transform: rotate(-1deg); width: 105%; margin-left: -2%; z-index: 10; }
        h1 { margin: 0; font-size: 1.2rem; letter-spacing: 2px; font-weight: 900; text-transform: uppercase; }

        .content { flex-grow: 1; display: flex; flex-direction: column; position: relative; }

        /* Mobil-Optimierter Viewport */
        #hologram-zone { height: 50vh; width: 100%; border-bottom: 3px solid var(--p-black); background: #fff; }

        .dashboard { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: var(--p-white); }
        .stat-box { border: 2px solid var(--p-black); padding: 10px; background: #fff; box-shadow: 5px 5px 0px var(--p-black); }
        .stat-label { font-size: 0.6rem; font-weight: bold; color: var(--p-blue); }
        .stat-val { font-size: 1.1rem; font-weight: 900; }

        .log-area { flex-grow: 1; overflow-y: auto; padding: 15px; font-family: 'Courier', monospace; font-size: 0.7rem; border-top: 2px solid var(--p-black); background: rgba(255,255,255,0.8); }
        .log-entry { margin-bottom: 4px; border-left: 4px solid var(--p-red); padding-left: 8px; }

        footer { background: var(--p-black); color: #fff; padding: 10px; font-size: 0.6rem; text-align: center; }
    </style>
</head>
<body>

<header>
    <h1>Apollo Nexus: Resonance</h1>
</header>

<div class="content">
    <div id="hologram-zone"></div>
    
    <div class="dashboard">
        <div class="stat-box" style="transform: rotate(1deg);">
            <div class="stat-label">S-ROI</div>
            <div class="stat-val" id="sroi-val">0.5192</div>
        </div>
        <div class="stat-box" style="transform: rotate(-2deg); background: var(--p-yellow);">
            <div class="stat-label">RES-HZ</div>
            <div class="stat-val" id="freq-val">0.430</div>
        </div>
    </div>

    <div class="log-area" id="log-box">
        <div class="log-entry">Nexus initialisiert: Picasso-Integrität aktiv.</div>
    </div>
</div>

<footer>
    BOLZANO HUB | SCHUMANN 7.83 Hz | IN AETERNUM
</footer>

<script>
    // --- PICASSO 3D ENGINE ---
    const zone = document.getElementById('hologram-zone');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, zone.clientWidth / zone.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(zone.clientWidth, zone.clientHeight);
    zone.appendChild(renderer.domElement);

    // Fragmentierte Geometrie
    const geometry = new THREE.IcosahedronGeometry(2, 0); // Grobe Flächen
    const material = new THREE.MeshPhongMaterial({ 
        color: 0x0055a4, flatShading: true, shininess: 100, wireframe: false 
    });
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // Akzent-Linien
    const wire = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true }));
    mesh.add(wire);

    camera.position.z = 5;
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 5, 5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    function animate() {
        requestAnimationFrame(animate);
        mesh.rotation.y += 0.01;
        mesh.rotation.x += 0.005;
        
        // Drifts
        document.getElementById('sroi-val').innerText = (0.5192 + (Math.random()-0.5)*0.001).toFixed(4);
        document.getElementById('freq-val').innerText = (0.43 + (Math.random()-0.5)*0.01).toFixed(3);
        
        renderer.render(scene, camera);
    }
    animate();

    // Log-Logik
    const messages = ["D6-Vakuum: Sync.", "Micosi-Router: On.", "Lex Amore: Aktiv.", "Fragmentierung: Stabil."];
    setInterval(() => {
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerText = `[${new Date().toLocaleTimeString()}] ${messages[Math.floor(Math.random()*messages.length)]}`;
        const box = document.getElementById('log-box');
        box.prepend(entry);
        if(box.childNodes.length > 10) box.lastChild.remove();
    }, 4000);
</script>
</body>
</html>
