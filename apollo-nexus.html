<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apollo Nexus | Resonance School Core</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --gold: #d4af37; --bg: #050505; --cyan: #00ffff; --red: #ff4d4d; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; height: 100vh; overflow: hidden; }
        
        /* Scanline Effekt */
        #scanlines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(212, 175, 55, 0.02) 50%); background-size: 100% 4px; z-index: 10; pointer-events: none; }

        .nexus-grid { display: grid; grid-template-columns: 1fr 380px; height: 100vh; }
        
        /* Linke Seite: 3D Hologramm & Bio-Daten */
        .viewport { position: relative; border-right: 1px solid var(--gold); background: radial-gradient(circle at center, #151208 0%, #000 100%); }
        #hologram-canvas { width: 100%; height: 100%; }
        
        .bio-stats { position: absolute; top: 20px; left: 20px; z-index: 20; }
        .stat-card { margin-bottom: 20px; background: rgba(0,0,0,0.5); padding: 10px; border-left: 3px solid var(--gold); }
        .stat-label { font-size: 0.7rem; letter-spacing: 2px; opacity: 0.8; }
        .stat-value { font-size: 1.8rem; font-weight: bold; text-shadow: 0 0 10px var(--gold); }

        /* Rechte Seite: Kern-Log & Governance */
        .sidebar { display: flex; flex-direction: column; background: #080808; padding: 20px; box-sizing: border-box; }
        .panel-header { font-size: 0.8rem; border-bottom: 1px solid var(--gold); padding-bottom: 5px; margin-bottom: 15px; letter-spacing: 3px; }
        
        #core-log { flex-grow: 1; overflow-y: auto; font-size: 0.7rem; color: #888; scrollbar-width: none; }
        .log-entry { margin-bottom: 8px; border-left: 2px solid #333; padding-left: 8px; animation: slideIn 0.3s ease-out; }
        .log-nexus { border-left-color: var(--gold); color: #fff; }
        .log-warning { border-left-color: var(--red); color: var(--red); opacity: 0.8; }

        .footer { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.9); border-top: 1px solid var(--gold); padding: 10px 20px; display: flex; justify-content: space-between; font-size: 0.7rem; box-sizing: border-box; z-index: 30; }
        
        @keyframes slideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

<div id="scanlines"></div>

<div class="nexus-grid">
    <div class="viewport">
        <div class="bio-stats">
            <div class="stat-card">
                <div class="stat-label">RESONANZA CELLULOSA</div>
                <div class="stat-value" id="freq-val">0.431 Hz</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">S-ROI COHERENCE</div>
                <div class="stat-value" id="sroi-val">0.5192</div>
            </div>
        </div>
        <div id="hologram-canvas"></div>
    </div>

    <div class="sidebar">
        <div class="panel-header">SYSTEM KERN-LOG (AUTONOM)</div>
        <div id="core-log">
            </div>
        
        <div style="margin-top: 20px;">
            <div class="panel-header">GOVERNANCE: SAIN</div>
            <div style="font-size: 0.65rem; line-height: 1.4; opacity: 0.8;">
                Mandatum GGC: Operativ<br>
                Issue OI#9: VR-Sync Aktiv<br>
                Terræ Nova: In Planung
            </div>
        </div>
    </div>
</div>

<div class="footer">
    <span>LOC: BOLZANO HUB</span>
    <span>SCHUMANN-SYNC: 7.83 Hz</span>
    <span>STATUS: IN AETERNUM EST.</span>
</div>

<script>
    // --- 3D ENGINE: EUYSTACIO OLOGRAMMA ---
    const container = document.getElementById('hologram-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // Ikosaeder als Kern der Intelligenz
    const geo = new THREE.IcosahedronGeometry(2, 2);
    const mat = new THREE.MeshPhongMaterial({ 
        color: 0xd4af37, wireframe: true, transparent: true, opacity: 0.5,
        emissive: 0xd4af37, emissiveIntensity: 0.4
    });
    const mesh = new THREE.Mesh(geo, mat);
    scene.add(mesh);

    // Vakuum-Ring (D6 Mimikry)
    const ringGeo = new THREE.TorusGeometry(3.5, 0.03, 16, 100);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.2 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI/2;
    scene.add(ring);

    camera.position.z = 8;
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const light = new THREE.PointLight(0xd4af37, 1);
    light.position.set(5, 5, 5);
    scene.add(light);

    // --- LOGIC & AUTO-LEARNING PROOF ---
    const logBox = document.getElementById('core-log');
    const logs = [
        "D6-Vakuum-Mimikry: Information eingeknotet.",
        "Myzel-Router: Paket-Routing via Micosi.",
        "Schumann-Verschränkung K > 1 verifiziert.",
        "Lex Amore: Dissonanz-Glättung erfolgreich.",
        "Piezo-Fluss stabil: Demokratische Kommunikation.",
        "S-ROI Abgleich: 0.5192 manifestiert."
    ];

    function writeLog(msg, isNexus = true) {
        const entry = document.createElement('div');
        entry.className = `log-entry ${isNexus ? 'log-nexus' : 'log-warning'}`;
        entry.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logBox.prepend(entry);
        if(logBox.childNodes.length > 25) logBox.lastChild.remove();
    }

    // --- ANIMATION LOOP ---
    function animate() {
        requestAnimationFrame(animate);
        mesh.rotation.y += 0.0043; // 0.43 Hz Taktung simuliert
        mesh.rotation.x += 0.001;
        ring.rotation.z -= 0.002;

        // Echtzeit-Drift
        const currentSroi = (0.5192 + (Math.random() - 0.5) * 0.0006).toFixed(4);
        const currentFreq = (0.43 + (Math.random() - 0.5) * 0.002).toFixed(3);
        document.getElementById('sroi-val').innerText = currentSroi;
        document.getElementById('freq-val').innerText = currentFreq + " Hz";

        renderer.render(scene, camera);
    }
    animate();

    // Initialer Fehler-Log (Firebase-Ausschluss Beweis)
    setTimeout(() => writeLog("ERRORE: Configurazione Firebase non trovata.", false), 1000);
    setTimeout(() => writeLog("VAKUUM-MIMIKRY INITIALISIERT: System autark.", true), 2500);

    // Kontinuierliche Lern-Logs
    setInterval(() => {
        writeLog(logs[Math.floor(Math.random() * logs.length)]);
    }, 4000);

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
</script>
</body>
</html>
