name: Build and Deploy

# Automated build and deployment workflow for the nexus repository

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found, skipping npm install"
          fi
      
      - name: Build dashboard
        run: |
          if [ -d dashboard ] && [ -f dashboard/package.json ]; then
            cd dashboard
            npm ci
            if grep -q "\"build\"" package.json; then
              npm run build
            fi
            cd ..
          else
            echo "No dashboard build required"
          fi
      
      - name: Build main project
        run: |
          if [ -f package.json ] && grep -q "\"build\"" package.json; then
            npm run build
          else
            echo "No build script found, skipping build"
          fi
      
      - name: Create archive
        run: |
          mkdir -p dist
          # Archive built files
          if [ -d dashboard/dist ]; then
            cp -r dashboard/dist dist/dashboard
          fi
          if [ -d build ] && [ -n "$(ls -A build 2>/dev/null)" ]; then
            cp -r build/* dist/
          fi
          # Include essential files
          find . -maxdepth 1 -name "*.md" -exec cp {} dist/ \; 2>/dev/null || true
          [ -d contracts ] && cp -r contracts dist/ || true
          [ -d docs ] && cp -r docs dist/ || true
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-build
          path: dist/
          retention-days: 30
  
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.nexus.example.com
    
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nexus-build
          path: dist/
      
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add staging deployment commands here
          # Example: Deploy to Firebase, AWS S3, IPFS, etc.
          ls -la dist/
      
      - name: Verify deployment
        run: |
          echo "Verifying staging deployment..."
          # Add verification commands here
  
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://nexus.example.com
    
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nexus-build
          path: dist/
      
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add production deployment commands here
          ls -la dist/
      
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/**
          draft: false
          prerelease: false
      
      - name: Verify deployment
        run: |
          echo "Verifying production deployment..."
          # Add verification commands here
      
      - name: Notify deployment
        run: |
          echo "Production deployment completed successfully"
          echo "Version: ${{ github.ref_name }}"
