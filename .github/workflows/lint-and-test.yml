name: Lint and Test

# Linting and testing workflow consistent with LexAmoris ecosystem standards

on:
  push:
    branches: [ main, develop, 'copilot/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found, skipping npm install"
          fi
      
      - name: Lint JavaScript/TypeScript
        run: |
          if [ -f package.json ] && grep -q "\"lint\"" package.json; then
            npm run lint
          else
            echo "No lint script found, skipping JS/TS linting"
          fi
      
      - name: Check Markdown
        uses: articulate/actions-markdownlint@v1
        continue-on-error: true
        with:
          config: .markdownlint.json
          files: '**/*.md'
          ignore: node_modules
      
      - name: Lint Solidity contracts
        if: hashFiles('**/*.sol') != ''
        continue-on-error: true
        run: |
          # Install solhint if Solidity files exist
          if command -v npx &> /dev/null; then
            npx --yes solhint 'contracts/**/*.sol' '*.sol' 2>/dev/null || echo "Solhint linting skipped or not configured"
          else
            echo "npx not available, skipping Solidity linting"
          fi
      
      - name: Check shell scripts
        if: hashFiles('**/*.sh') != ''
        run: |
          # Install shellcheck if available
          if command -v shellcheck &> /dev/null; then
            find . -name "*.sh" -not -path "./node_modules/*" -exec shellcheck {} + || true
          else
            echo "shellcheck not available, skipping shell script checking"
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found, skipping npm install"
          fi
      
      - name: Run unit tests
        run: |
          if [ -f package.json ] && grep -q "\"test\"" package.json; then
            npm test
          else
            echo "No test script found, skipping tests"
          fi
      
      - name: Test smart contracts
        if: hashFiles('**/*.sol') != ''
        run: |
          if [ -f package.json ] && grep -q "hardhat" package.json; then
            npx hardhat test 2>/dev/null || echo "Hardhat tests not configured"
          else
            echo "Hardhat not found, skipping contract tests"
          fi
      
      - name: Generate coverage report
        if: hashFiles('package.json') != ''
        continue-on-error: true
        run: |
          if grep -q "\"coverage\"" package.json; then
            npm run coverage
          else
            echo "No coverage script found, skipping coverage"
          fi
      
      - name: Upload coverage to Codecov
        if: hashFiles('coverage/**') != ''
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-nexus

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run npm audit
        if: hashFiles('package-lock.json') != ''
        continue-on-error: true
        run: |
          npm audit --audit-level=moderate || true
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
