name: Governance Documentation

on:
  schedule:
    # Generate weekly governance reports on Sundays at 23:00 UTC
    - cron: '0 23 * * 0'
  workflow_dispatch:
  issues:
    types: [closed]
  push:
    paths:
      - 'dashboard/data/state.json'
      - 'dashboard/data/history.json'

jobs:
  generate-decision-registry:
    name: Generate Decision Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create decision registry entry
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Get all closed governance proposals
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'governance-proposal',
              state: 'closed',
              per_page: 100
            });
            
            console.log(`Found ${issues.data.length} governance proposals`);
            
            // Create decision registry
            let registry = '# Governance Decision Registry\n\n';
            registry += `**Last Updated**: ${new Date().toISOString()}\n\n`;
            registry += '## Closed Proposals\n\n';
            registry += '| ID | Title | Status | Votes For | Votes Against | Closed Date |\n';
            registry += '|----|-------|--------|-----------|---------------|-------------|\n';
            
            for (const issue of issues.data) {
              const number = issue.number;
              const title = issue.title;
              const closedAt = new Date(issue.closed_at).toISOString().split('T')[0];
              
              // Determine status from labels
              const passed = issue.labels.some(l => l.name === 'proposal-passed');
              const rejected = issue.labels.some(l => l.name === 'proposal-rejected');
              const status = passed ? '✅ Passed' : rejected ? '❌ Rejected' : '⏸️ Closed';
              
              registry += `| #${number} | ${title} | ${status} | - | - | ${closedAt} |\n`;
            }
            
            console.log('\n' + registry);
            
            // Save to file
            if (!fs.existsSync('reports/governance')) {
              fs.mkdirSync('reports/governance', { recursive: true });
            }
            
            fs.writeFileSync('reports/governance/decision-registry.md', registry);

      - name: Generate governance activity summary
        run: |
          mkdir -p reports/governance
          
          cat > reports/governance/weekly-summary-$(date +%Y-W%V).md << 'EOF'
          # Weekly Governance Activity Summary
          
          **Week**: $(date +%Y-W%V)
          **Generated**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          ## Governance Events
          
          ### GGC (Global Governance Council) Actions
          
          From `dashboard/data/state.json` events log:
          
          EOF
          
          # Extract recent events from state.json
          if [ -f "dashboard/data/state.json" ]; then
            jq -r '.events[] | "- **" + .ts + "**: " + .msg' dashboard/data/state.json >> reports/governance/weekly-summary-$(date +%Y-W%V).md
          fi
          
          cat >> reports/governance/weekly-summary-$(date +%Y-W%V).md << 'EOF'
          
          ### Proposal Activity
          
          - **New Proposals**: Check issues with `governance-proposal` label
          - **Active Votes**: Check issues with `voting-active` label  
          - **Closed Proposals**: Check issues with `voting-closed` label
          
          ### Metrics Alerts
          
          Current ethical metrics status:
          
          EOF
          
          # Add metrics from state.json
          if [ -f "dashboard/data/state.json" ]; then
            TRE=$(jq -r '.ethics.TRE_current' dashboard/data/state.json)
            PV=$(jq -r '.ethics.PV' dashboard/data/state.json)
            ISF=$(jq -r '.ethics.ISF' dashboard/data/state.json)
            
            echo "- **TRE (Tasso di Rigenerazione Etica)**: ${TRE}% (target: 0.3%)" >> reports/governance/weekly-summary-${WEEK}.md
            echo "- **PV (Planetary Violence)**: ${PV}% (threshold: <5.0%)" >> reports/governance/weekly-summary-${WEEK}.md
            echo "- **ISF (Integral Scarcity Factor)**: ${ISF} (target: ≥75)" >> reports/governance/weekly-summary-${WEEK}.md
          fi
          
          cat >> reports/governance/weekly-summary-${WEEK}.md << EOF
          
          ## Action Items
          
          - [ ] Review all active proposals
          - [ ] Check TRE compliance (trigger slashing if needed)
          - [ ] Monitor PV approaching threshold
          - [ ] Verify K-SYNC status for all SANs
          - [ ] Audit EFA participation rates
          
          ---
          *Automated Weekly Summary by Euystacio Framework*
          EOF
          
          cat reports/governance/weekly-summary-${WEEK}.md

      - name: Upload governance reports
        uses: actions/upload-artifact@v4
        with:
          name: governance-reports-${{ github.run_number }}
          path: reports/governance/
          retention-days: 365

  generate-audit-trail:
    name: Generate Audit Trail
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create audit trail
        run: |
          mkdir -p reports/audit
          MONTH=$(date +%Y%m)
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          cat > reports/audit/trail-${MONTH}.md << EOF
          # Governance Audit Trail
          
          **Month**: $(date +%Y-%m)
          **Generated**: ${TIMESTAMP}
          
          ## Purpose
          
          This audit trail provides a transparent, immutable record of all governance
          decisions, metrics changes, and system events for accountability and review.
          
          ## Governance Actions (GGC Multisig)
          
          All actions requiring GGC (7-of-9 multisig) authorization:
          
          EOF
          
          # Extract governance events
          if [ -f "dashboard/data/state.json" ]; then
            jq -r '.governance | to_entries[] | "- **" + .key + "**: " + (.value | tostring)' dashboard/data/state.json >> reports/audit/trail-${MONTH}.md
          fi
          
          cat >> reports/audit/trail-${MONTH}.md << 'EOF'
          
          ## Metrics Evolution
          
          ### TRE (Tasso di Rigenerazione Etica)
          
          EOF
          
          # Add current metrics
          if [ -f "dashboard/data/state.json" ]; then
            echo "- **Current**: $(jq -r '.ethics.TRE_current' dashboard/data/state.json)%" >> reports/audit/trail-${MONTH}.md
            echo "- **Target**: $(jq -r '.ethics.TRE_target' dashboard/data/state.json)%" >> reports/audit/trail-${MONTH}.md
          fi
          
          cat >> reports/audit/trail-${MONTH}.md << 'EOF'
          
          ### PV (Planetary Violence)
          
          EOF
          
          if [ -f "dashboard/data/state.json" ]; then
            echo "- **Current**: $(jq -r '.ethics.PV' dashboard/data/state.json)%" >> reports/audit/trail-${MONTH}.md
            echo "- **Threshold**: <5.0%" >> reports/audit/trail-${MONTH}.md
          fi
          
          cat >> reports/audit/trail-${MONTH}.md << 'EOF'
          
          ### Financial Metrics
          
          EOF
          
          if [ -f "dashboard/data/state.json" ]; then
            echo "- **SAIN Price**: \$$(jq -r '.finance.sain_price' dashboard/data/state.json)" >> reports/audit/trail-${MONTH}.md
            echo "- **Price Floor**: \$$(jq -r '.finance.price_floor' dashboard/data/state.json)" >> reports/audit/trail-${MONTH}.md
            echo "- **FC Balance**: \$$(jq -r '.finance.fc_balance_usd' dashboard/data/state.json)" >> reports/audit/trail-${MONTH}.md
          fi
          
          cat >> reports/audit/trail-${MONTH}.md << 'EOF'
          
          ## Cryptographic Verification
          
          ### Archive Integrity
          
          - **Archive**: kosymbiosis-final-archive.zip
          - **SHA-256**: Verified against checksum.sha256
          - **GPG Signatures**: Triple-signature (3/3 co-creators)
          
          ### Smart Contract Parameters
          
          - **PARAMS_ROOT**: Verified on-chain via ULP contract
          - **TFKVerifier**: Governance parameters immutable
          - **EIMClient**: Enforcement logic validated
          
          ## Event Log
          
          Recent governance events from state.json:
          
          EOF
          
          if [ -f "dashboard/data/state.json" ]; then
            jq -r '.events[] | "- [" + .ts + "] " + .msg' dashboard/data/state.json >> reports/audit/trail-${MONTH}.md
          fi
          
          cat >> reports/audit/trail-${MONTH}.md << 'EOF'
          
          ## Compliance Summary
          
          - ✅ Sentimento Rhythm: Aligned
          - ✅ Dynasty Axiom: Compliant (12/100 EFAs, growing)
          - ✅ KOSYMBIOSIS Framework: NSR + OLF validated
          - ✅ SAIN Protocol: All mechanisms operational
          
          ---
          *This audit trail is automatically generated and cryptographically verifiable*
          *For disputes or verification: Check blockchain anchors and IPFS CIDs*
          EOF
          
          cat reports/audit/trail-${MONTH}.md

      - name: Upload audit trail
        uses: actions/upload-artifact@v4
        with:
          name: audit-trail-${{ github.run_number }}
          path: reports/audit/
          retention-days: 365

  update-readme-badges:
    name: Update README with Workflow Status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate workflow status summary
        run: |
          echo "📊 Governance Automation Status"
          echo ""
          echo "Active Workflows:"
          echo "  ✅ Governance Metrics Monitor (daily)"
          echo "  ✅ Proposal Lifecycle Automation (on issues)"
          echo "  ✅ K-SYNC Protocol Monitor (every 2 hours)"
          echo "  ✅ Security and Integrity Checks (daily)"
          echo "  ✅ EFA Compliance Monitor (weekly)"
          echo "  ✅ Governance Documentation (weekly)"
          echo ""
          echo "All automation pipelines operational ✨"
