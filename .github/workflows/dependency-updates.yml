name: Dependency Updates

# Automated dependency updates and security patches

on:
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Update npm dependencies
        if: hashFiles('package.json') != ''
        run: |
          echo "Checking for npm updates..."
          if [ -f package.json ]; then
            # Update dependencies while respecting semver
            npm update --save
            npm audit fix --audit-level=moderate || true
          fi
      
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet package.json package-lock.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies'
          title: 'chore: automated dependency updates'
          body: |
            Automated dependency updates for the nexus repository.
            
            This PR includes:
            - Updated npm packages to latest compatible versions
            - Security patches applied via npm audit fix
            
            Please review the changes and ensure all tests pass before merging.
          branch: automated-deps-update
          delete-branch: true
          labels: dependencies,automated

  check-outdated:
    name: Check Outdated Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Check outdated packages
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package.json ]; then
            npm outdated || true
          fi
      
      - name: Security audit
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=moderate || true
          fi
